# =============================================================
# 名称：EAS 云端打包 + 发布到 GitHub Release
# 说明：
#   - 仅当推送「v*」开头的 git tag 时才触发（如 v1.0.0）
#   - 普通 commit / 分支推送不会触发本流程
#   - Android：EAS 云构建（免费），产出可安装的 APK
#   - iOS 模拟器：macOS runner 无签名编译，产出模拟器专用 IPA（免费，无需 Apple 账号）
#   - iOS 真机：可选开关 ENABLE_IOS_BUILD=true 才构建已签名 IPA
#     （真机必须付费 Apple 开发者账号）
#   - 产物自动上传到对应 tag 的 GitHub Release 页面
# 前置条件（详见 README_RELEASE.md）：
#   - 仓库设置 Actions secret：EXPO_TOKEN（expo.dev 的 Access Token）
#   - 可选：启用真机 iOS 时额外配置 9 个 Apple 证书 Secrets +
#     仓库变量 ENABLE_IOS_BUILD=true
# =============================================================
name: Build & Release

on:
  push:
    # 只监听 tag 推送：v1.0.0、v1.2.3-rc.1 等；HEAD/分支推送不触发
    tags:
      - 'v*'

# 给当前 run 的 GITHUB_TOKEN 授予写权限（创建 Release 附件需要）
permissions:
  contents: write

# 同一 tag 重复触发时取消旧任务，避免排队积压
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 任务 1：Android APK（EAS 云构建，免费可行）
  # -----------------------------------------------------------
  build-android:
    name: Android APK (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 EXPO_TOKEN 已配置
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "::error::未配置 EXPO_TOKEN。请在仓库 Settings → Secrets → Actions 添加（详见 README_RELEASE.md）。"
          exit 1

      - name: EAS 构建 APK（等待云端构建完成）
        # --json 把构建结果打印为 JSON，我们从中取 artifacts.buildUrl
        run: |
          npx --yes eas-cli@latest build \
            --platform android --profile preview --non-interactive --json > build.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('build.json','utf8'));const x=Array.isArray(b)?b[0]:b;const u=(x&&x.artifacts&&x.artifacts.buildUrl)||'';if(!u){console.error('未拿到构建产物 URL：');console.error(JSON.stringify(b,null,2));process.exit(1)};require('fs').writeFileSync('apk-url.txt',u)"

      - name: 下载 APK
        run: |
          curl -fsSL -o countdown-day.apk "$(cat apk-url.txt)"
          ls -lh countdown-day.apk

      - name: 上传 APK 产物（供 Release 任务消费）
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: countdown-day.apk
          if-no-files-found: error

  # -----------------------------------------------------------
  # 任务 2：iOS 模拟器 IPA（无签名、完全免费）
  # 说明：
  #   - 在 macOS runner 上本地编译「iOS Simulator」目标，禁用代码签名
  #     （CODE_SIGNING_ALLOWED=NO），无需任何 Apple 账号/证书。
  #   - 产物只装得上 Xcode 模拟器（真实 iPhone 强制签名装不了），
  #     适合预览/开发分发；建议标记为 simulator build。
  # -----------------------------------------------------------
  build-ios-simulator:
    name: iOS Simulator IPA (无签名)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 iOS 原生工程（Expo CNG，无需提交原生目录）
        run: npx expo prebuild --platform ios --no-install

      - name: 安装 CocoaPods 依赖
        working-directory: ios
        run: pod install

      - name: 探测 workspace / scheme（app.json 的 name 是中文，不能写死）
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)
          test -n "$WORKSPACE" || { echo "未找到 xcworkspace"; exit 1; }
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          xcodebuild -workspace "$WORKSPACE" -list -json > schemes.json
          SCHEME=$(node -e "const s=JSON.parse(require('fs').readFileSync('schemes.json','utf8'));console.log(s.workspace.schemes[0])")
          test -n "$SCHEME" || { echo "未找到 scheme"; exit 1; }
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: 编译模拟器包（禁用代码签名，无需 Apple 账号）
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包为模拟器 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -d "$APP" || { echo "未找到 .app 产物"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry countdown-day-simulator.ipa Payload
          ls -lh countdown-day-simulator.ipa

      - name: 上传模拟器 IPA 产物（供 Release 任务消费）
        uses: actions/upload-artifact@v4
        with:
          name: ipa-sim
          path: countdown-day-simulator.ipa
          if-no-files-found: error

  # -----------------------------------------------------------
  # 任务 3：iOS 真机 IPA（EAS，默认关闭）
  # 注意：Apple 强制签名，真机分发包必须付费开发者账号（$99/年）。
  # 免费 Apple ID 只能自装 3 台设备、7 天过期，无法作为公开 Release 产物。
  # 启用方法：仓库变量 ENABLE_IOS_BUILD=true + 配置 9 个 Apple Secrets，
  # 并在 eas.json 对应 profile 加 "distribution": "internal"。
  # -----------------------------------------------------------
  build-ios:
    name: iOS IPA (EAS, 需付费证书)
    if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 EXPO_TOKEN 已配置
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "::error::未配置 EXPO_TOKEN。请在仓库 Settings → Secrets → Actions 添加（详见 README_RELEASE.md）。"
          exit 1

      - name: EAS 构建 IPA（等待云端构建完成）
        run: |
          npx --yes eas-cli@latest build \
            --platform ios --profile preview --non-interactive --json > build.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('build.json','utf8'));const x=Array.isArray(b)?b[0]:b;const u=(x&&x.artifacts&&x.artifacts.buildUrl)||'';if(!u){console.error('未拿到构建产物 URL：');console.error(JSON.stringify(b,null,2));process.exit(1)};require('fs').writeFileSync('ipa-url.txt',u)"

      - name: 下载 IPA
        run: |
          curl -fsSL -o countdown-day.ipa "$(cat ipa-url.txt)"
          ls -lh countdown-day.ipa

      - name: 上传 IPA 产物（供 Release 任务消费）
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: countdown-day.ipa
          if-no-files-found: error

  # -----------------------------------------------------------
  # 任务 4：发布到 GitHub Release
  # 默认发布：Android APK + iOS 模拟器 IPA（均免费）；
  # 启用了真机 iOS（ENABLE_IOS_BUILD）时额外发布已签名的 IPA。
  # build-ios 跳过（未启用）时不影响本任务执行。
  # -----------------------------------------------------------
  release:
    name: 发布到 GitHub Release
    needs: [build-android, build-ios-simulator, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载 Android APK 产物
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: release-files

      - name: 下载 iOS 模拟器 IPA 产物
        uses: actions/download-artifact@v4
        with:
          name: ipa-sim
          path: release-files

      - name: 下载 iOS 真机 IPA 产物（仅当真机 iOS 构建启用时存在）
        if: ${{ vars.ENABLE_IOS_BUILD == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: ipa
          path: release-files

      - name: 确认 Release 文件清单
        run: ls -lh release-files

      - name: 创建/更新 Release 并上传附件
        # 自动使用当前 tag 名（v*）；tag 已存在则更新附件
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false